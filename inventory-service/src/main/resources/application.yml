spring:
  application:
    name: inventory-service

  datasource:
    url: jdbc:postgresql://inventory_db_container:5432/inventory_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

server:
  port: 8084

logging:
  level:
    "[org.springframework]": INFO
    java: DEBUG